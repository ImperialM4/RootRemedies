# black-raisins.yaml

title: "Black Raisins"

description: "A traditional food-based remedy using black raisins as a naturally sweet snack to provide energy during illness."

ingredients:
  - item: "Black raisins"
    amount: "10-15 raisins"
  - item: "Water (optional, for soaking)"
    amount: "Enough to cover raisins"

preparationSteps:
  - step: 1
    instruction: "Wash the black raisins thoroughly."
  - step: 2
    instruction: "Soak the raisins in water for several hours or overnight if desired."
  - step: 3
    instruction: "Drain excess water before eating."

usageInstructions: "Eat the prepared black raisins as a small snack during illness when appetite is reduced."

notes: "Black raisins may help provide quick energy and nutrients but do not treat the infection causing a fever."

safetyNotes:
  - "Avoid eating large amounts if you are sensitive to high sugar foods."
  - "Wash raisins properly before consumption."
  - "Stop use if you experience an allergic reaction."