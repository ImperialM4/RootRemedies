# ginger-holy-basil-drink.yaml

title: "Ginger and Holy Basil Drink"

description: "A traditional herbal drink combining ginger and holy basil (Tulsi), two plants commonly used during seasonal illnesses."

ingredients:

  - item: "Fresh ginger slices"

    amount: "1-2 teaspoons"

  - item: "Fresh holy basil (Tulsi) leaves"

    amount: "5-10 leaves"

  - item: "Water"

    amount: "1 cup"

  - item: "Honey (optional)"

    amount: "1 teaspoon"



preparationSteps:

  - step: 1

    instruction: "Wash the ginger and holy basil leaves thoroughly."

  - step: 2

    instruction: "Slice the ginger into small pieces."

  - step: 3

    instruction: "Boil water and add the ginger slices."

  - step: 4

    instruction: "Add holy basil leaves and allow the mixture to simmer for several minutes."

  - step: 5

    instruction: "Strain the drink and add honey if desired."



usageInstructions: "Drink the warm herbal tea slowly while resting and maintaining hydration during illness."



notes: "This traditional drink may provide comfort during a fever but is not a substitute for medical care."



safetyNotes:

  - "Avoid honey for children under 1 year old."

  - "Stop use if you experience irritation or an allergic reaction."

  - "Speak with a healthcare professional if fever symptoms worsen or do not improve."