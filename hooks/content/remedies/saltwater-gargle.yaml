title: "Saltwater Gargle"
description: "A simple saltwater rinse traditionally used to soothe sore throats and reduce irritation."

ingredients:
  - item: "Salt"
    amount: "1 pinch"
  - item: "Warm water"
    amount: "1 cup"

preparationSteps:
  - step: 1
    instruction: "Add the salt to the warm water."
  - step: 2
    instruction: "Stir until the salt is completely dissolved."

usageInstructions: "Gargle for 20 to 30 seconds before spitting it out. Repeat several times if desired."

notes: "Use comfortably warm water, not boiling water."

safetyNotes:
  - "Do not swallow large amounts of saltwater."
  - "Avoid excessively hot water to prevent burns."