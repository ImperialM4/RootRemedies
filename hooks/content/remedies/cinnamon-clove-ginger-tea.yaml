# cinnamon-clove-ginger-tea.yaml

title: "Cinnamon, Clove, and Ginger Tea"

description: "A traditional warming herbal tea combining cinnamon, cloves, and ginger, commonly enjoyed for comfort during illness."

ingredients:
  - item: "Fresh ginger slices"
    amount: "1-2 teaspoons"
  - item: "Cinnamon stick"
    amount: "1 small stick"
  - item: "Cloves"
    amount: "2-3 cloves"
  - item: "Water"
    amount: "1 cup"
  - item: "Honey (optional)"
    amount: "1 teaspoon"

preparationSteps:
  - step: 1
    instruction: "Wash and prepare the ginger slices."
  - step: 2
    instruction: "Boil water with ginger, cinnamon, and cloves."
  - step: 3
    instruction: "Simmer for 5-10 minutes to allow the flavors to infuse."
  - step: 4
    instruction: "Strain the tea and add honey if desired."

usageInstructions: "Drink the warm tea slowly while resting and staying hydrated during illness."

notes: "This tea may provide comfort and support hydration but does not directly treat fever."

safetyNotes:
  - "Avoid ingredients that you are allergic to."
  - "Do not consume excessive amounts of cinnamon or cloves."
  - "Avoid honey for children under 1 year old."