title: "Honey Water"
description: "A simple drink that combines hydration with the natural sweetness of honey."

ingredients:
  - item: "Honey"
    amount: "1 teaspoon"
  - item: "Cold water"
    amount: "1 cup"

preparationSteps:
  - step: 1
    instruction: "Add the honey to the water."
  - step: 2
    instruction: "Stir until completely dissolved."

usageInstructions: "Drink immediately after preparing."

notes: "Hydration helps keep stool soft, while honey contains natural sugars that may gently encourage bowel movements."

safetyNotes:
  - "Do not give honey to children under 12 months of age."
  - "Use in moderation if monitoring sugar intake."