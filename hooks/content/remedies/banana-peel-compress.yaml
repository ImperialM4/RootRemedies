title: "Banana Peel Compress"
description: "A traditional external remedy using the inside of a banana peel as a neck compress."

ingredients:
  - item: "Clean banana peel"
    amount: "1"

preparationSteps:
  - step: 1
    instruction: "Wash the banana peel thoroughly under running water."
  - step: 2
    instruction: "Pat the peel dry with a clean towel."

usageInstructions: "Place the inside of the peel gently against the outside of the neck in the area of discomfort and leave it in place for several minutes."

notes: "This remedy is intended for external use only."

safetyNotes:
  - "Do not apply over broken or irritated skin."
  - "Discontinue use if skin irritation develops."