title: "Castor Oil and Warm Water"
description: "A traditional stimulant laxative prepared by mixing castor oil into warm water."

ingredients:
  - item: "Castor oil"
    amount: "1 tablespoon"
  - item: "Warm water"
    amount: "1 cup"

preparationSteps:
  - step: 1
    instruction: "Pour the castor oil into the warm water."
  - step: 2
    instruction: "Stir well before drinking."

usageInstructions: "Drink immediately after mixing."

notes: "Castor oil is broken down into ricinoleic acid, which stimulates the muscles of the intestines and encourages bowel movements."

safetyNotes:
  - "Use only occasionally and not as a long-term remedy."
  - "Do not use during pregnancy unless directed by a healthcare professional."
  - "Stop use and seek medical advice if severe cramping or diarrhea occurs."