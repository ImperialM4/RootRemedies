# mint-ginger-decoction.yaml

title: "Mint and Ginger Decoction"

description: "A traditional warm herbal drink combining mint and ginger, commonly enjoyed for comfort and hydration during fever."

ingredients:

  - item: "Fresh ginger slices"

    amount: "1-2 teaspoons"

  - item: "Fresh mint leaves"

    amount: "5-10 leaves"

  - item: "Water"

    amount: "1 cup"

  - item: "Honey (optional)"

    amount: "1 teaspoon"



preparationSteps:

  - step: 1

    instruction: "Wash the ginger and mint leaves thoroughly."

  - step: 2

    instruction: "Slice the ginger into small pieces."

  - step: 3

    instruction: "Boil water and add the ginger slices."

  - step: 4

    instruction: "Simmer for 5-10 minutes, then add mint leaves and steep briefly."

  - step: 5

    instruction: "Strain the drink into a cup and add honey if desired."



usageInstructions: "Drink the warm decoction slowly while resting and staying hydrated during a fever."



notes: "This remedy is intended as a comfort drink and does not directly treat the cause of a fever."



safetyNotes:

  - "Avoid honey for children under 1 year old."

  - "Stop use if you experience an allergic reaction to any ingredient."

  - "Consult a healthcare professional if fever symptoms are severe or persistent."